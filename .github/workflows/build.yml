name: Build Lunar Music IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          mkdir -p Support
          xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild -project LunarMusic.xcodeproj -target LunarMusic \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP=$(find build -name "LunarMusic.app" -type d | head -1)
          test -n "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry LunarMusic.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LunarMusic-ipa
          path: LunarMusic.ipa

      # Also publish the IPA on the repository's Releases page, where it is easy to find and download.
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LunarMusic.ipa --target "$GITHUB_SHA" \
            --title "Lunar Music (latest build)" \
            --notes "Unsigned IPA. Install it with Sideloadly or AltStore."
