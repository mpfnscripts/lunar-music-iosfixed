name: Build Lunar Music IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          mkdir -p Support
          xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild -project LunarMusic.xcodeproj -target LunarMusic \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP=$(find build -name "LunarMusic.app" -type d | head -1)
          test -n "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry LunarMusic.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LunarMusic-ipa
          path: LunarMusic.ipa
